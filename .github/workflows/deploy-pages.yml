name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check static site
        run: python3 scripts/check_site.py site
      - name: Validate Unit 03 computations and site contract
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check site/lab/03-block/app.js
      - name: Check Unit 03-B JavaScript syntax
        run: node --check site/lab/03-nano/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
