name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check static site
        run: python3 scripts/check_site.py site
      - name: Validate Unit 03 computations and site contract
        run: python3 -m unittest discover -s tests -v
      - name: Validate Unit 00 onboarding and real untrained trace
        run: |
          python3 -m unittest tests.test_unit00_onboarding -v
          node --check site/lab/00-overview/app.js
          node --check site/lab/01-cnn/app.js
      - name: Check JavaScript syntax
        run: node --check site/lab/03-block/app.js
      - name: Check Unit 03-B JavaScript syntax
        run: node --check site/lab/03-nano/app.js
      - name: Check Unit 03-C JavaScript syntax
        run: node --check site/lab/03-fpn-head/app.js
      - name: Test Unit 04 math and numerical contracts
        run: node --test tests/unit04_math.test.cjs
      - name: Check Unit 04 JavaScript syntax
        run: |
          node --check site/lab/04-detection/math.js
          node --check site/lab/04-detection/app.js
      - name: Validate Unit 05 static trace and structure
        run: |
          python3 -m unittest tests.test_unit05_contract -v
          node --check site/lab/05-training/app.js
      - name: Validate Unit 06 geometry and dataset contracts
        run: |
          python3 -m unittest tests.test_unit06_contract -v
          node --test tests/unit06_math.test.cjs
          node --check site/lab/06-tiny/math.js
          node --check site/lab/06-tiny/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
